# Publish to npm on version tags — auth via npm Trusted Publishing (OIDC),
# no NPM_TOKEN. Two tag forms:
#   <package>-v<version>        one standalone package, e.g. pi-session-id-v0.1.0
#   pi-extensions-v<version>    the all-in-one root collection package
name: Publish to npm
on:
  push:
    tags:
      - "*-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing (>= 11.5)
        run: npm install -g npm@latest
      - name: Parse tag and assert it matches the package version
        id: parse
        run: |
          node -e '
            const match = process.env.GITHUB_REF_NAME.match(/^(.+)-v(\d+\.\d+\.\d+(?:[-+][\w.]+)?)$/);
            if (!match) { console.error("Tag " + process.env.GITHUB_REF_NAME + " must be <package>-v<version> or pi-extensions-v<version>"); process.exit(1); }
            const [, pkg, version] = match;
            const manifestPath = pkg === "pi-extensions" ? "./package.json" : "./packages/" + pkg + "/package.json";
            let manifest;
            try { manifest = require(manifestPath); }
            catch { console.error("No package for tag: " + pkg); process.exit(1); }
            if (manifest.version !== version) { console.error("Tag version " + version + " does not match " + manifest.name + " package.json version " + manifest.version); process.exit(1); }
            console.log("package=" + pkg);
            console.log("version=" + version);
            console.log("dir=" + (pkg === "pi-extensions" ? "." : "packages/" + pkg));
          ' >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm test
      - name: Publish the tagged package (${{ steps.parse.outputs.package }}@${{ steps.parse.outputs.version }})
        run: npm publish --ignore-scripts --access public
        working-directory: ${{ steps.parse.outputs.dir }}
